[package]
name = "rapidrand"
version = "0.2.0"
edition = "2024"
publish = true
rust-version = "1.85.0"  # rand_core 0.10 is edition 2024; the base (no-rng) crate builds on older toolchains
authors = ["Liam Gray <gmail@liamg.me>"]
description = "An extremely fast pseudo-random number generator."
repository = "https://github.com/hoxxep/rapidrand"
documentation = "https://docs.rs/rapidrand"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["rand", "rng", "random", "no-std", "rapidhash"]
categories = ["algorithms", "no-std"]
exclude = ["Cargo.lock", "tests/exhaustive.rs"]

[lib]

# Test docs using cargo-docs. Command:
# RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["rand"]
rand = ["dep:rand_core"]  # implement rand_core's Rng/SeedableRng traits for RapidRand

[dependencies]
rand_core = { version = "0.10", default-features = false, optional = true }

[dev-dependencies]
rand = { version = "0.10" }  # for examples in doctests

[lints]
workspace = true
